<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoCore</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
    <style>
:root {
    --bg: #0a0707;
    --bg-card: #120c0c;
    --bg-inset: #1a1010;
    --red: #e6293b;
    --red-bright: #ff3b4e;
    --red-dim: #7a1620;
    --text-main: #f2e9e9;
    --text-muted: #8a7373;
    --border: rgba(230, 41, 59, 0.18);
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', system-ui, sans-serif;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 20% 0%, rgba(230,41,59,0.10), transparent 45%),
        radial-gradient(circle at 90% 100%, rgba(230,41,59,0.06), transparent 40%),
        var(--bg);
    color: var(--text-main);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

/* faint scanline texture across the whole viewport */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.012) 0px,
        rgba(255,255,255,0.012) 1px,
        transparent 1px,
        transparent 3px
    );
    z-index: 999;
}

.window {
    width: 92%;
    max-width: 420px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02);
    overflow: hidden;
    animation: rise 0.5s cubic-bezier(0.16,1,0.3,1) both;
}

@keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* terminal-style title bar — the signature element */
.titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: linear-gradient(180deg, #171010, #120c0c);
    border-bottom: 1px solid var(--border);
}

.dots { display: flex; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #3a2626; }
.dot.live {
    background: var(--red);
    box-shadow: 0 0 8px var(--red-bright);
    animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.titlebar-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-left: auto;
    text-transform: uppercase;
}

.body-pad { padding: 28px 28px 26px; }

h2 {
    margin: 0 0 22px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 10px;
}

h2::before {
    content: "";
    width: 3px;
    height: 15px;
    background: var(--red);
    display: inline-block;
    border-radius: 1px;
}

.menu, .section-content {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

button {
    background: var(--red);
    color: #100404;
    border: none;
    padding: 13px 18px;
    border-radius: 7px;
    font-weight: 600;
    font-size: 14px;
    font-family: var(--sans);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.18s ease;
}

button:hover { background: var(--red-bright); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(230,41,59,0.3); }
button:active { transform: translateY(0) scale(0.98); }

.btn-back {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    box-shadow: none;
    margin-top: 4px;
}
.btn-back:hover { background: rgba(230,41,59,0.06); color: var(--text-main); box-shadow: none; transform: none; }

.label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--red);
    margin: 4px 0 -4px;
}

input, textarea {
    background: var(--bg-inset);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 13px 14px;
    border-radius: 6px;
    font-size: 13.5px;
    font-family: var(--mono);
    outline: none;
    width: 100%;
    resize: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
}

input::placeholder, textarea::placeholder { color: #5a4747; font-family: var(--sans); }

input:focus, textarea:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(230,41,59,0.15);
}

textarea[readonly] { color: var(--red-bright); }

.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
    .window { animation: none; }
    .dot.live { animation: none; }
}
</style>
</head>
<body>

<div class="window">
    <div class="titlebar">
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot live"></div>
        </div>
        <div class="titlebar-label">AES-256-CBC</div>
    </div>

    <div class="body-pad">
        <div id="mainMenu" class="menu">
            <h2>CryptoCore</h2>
            <button onclick="show('gen')">Key generieren</button>
            <button onclick="show('enc')">Verschlüsseln</button>
            <button onclick="show('dec')">Entschlüsseln</button>
        </div>

        <div id="gen" class="hidden section-content">
            <h2>Generator</h2>
            <button id="doGen">Neuen Key erzeugen</button>
            <div class="label">Dein Key</div>
            <textarea id="outKey" rows="3" readonly></textarea>
            <button class="btn-back" onclick="show('mainMenu')">Zurück</button>
        </div>

        <div id="enc" class="hidden section-content">
            <h2>Encrypt</h2>
            <input type="text" id="inKeyEnc" placeholder="Key (Hex)">
            <input type="text" id="msgEnc" placeholder="Nachricht">
            <button id="doEnc">Verschlüsseln</button>
            <div class="label">Ergebnis</div>
            <textarea id="outEnc" rows="3" readonly></textarea>
            <button class="btn-back" onclick="show('mainMenu')">Zurück</button>
        </div>

        <div id="dec" class="hidden section-content">
            <h2>Decrypt</h2>
            <input type="text" id="inKeyDec" placeholder="Key (Hex)">
            <textarea id="msgDec" placeholder="Verschlüsselter Code" rows="3"></textarea>
            <button id="doDec">Entschlüsseln</button>
            <div class="label">Klartext</div>
            <textarea id="outDec" rows="2" readonly></textarea>
            <button class="btn-back" onclick="show('mainMenu')">Zurück</button>
        </div>
    </div>
</div>

<script>
function show(id) {
    document.querySelectorAll('.menu, .section-content').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

const toHex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
const fromHex = h => new Uint8Array(h.match(/.{1,2}/g).map(x => parseInt(x, 16))).buffer;

document.getElementById('doGen').onclick = async () => {
    const key = await crypto.subtle.generateKey({name:"AES-CBC", length:256}, true, ["encrypt", "decrypt"]);
    const exp = await crypto.subtle.exportKey("raw", key);
    document.getElementById('outKey').value = toHex(exp);
};

document.getElementById('doEnc').onclick = async () => {
    const keyHex = document.getElementById('inKeyEnc').value;
    const msg = document.getElementById('msgEnc').value;
    const iv = crypto.getRandomValues(new Uint8Array(16));
    const key = await crypto.subtle.importKey("raw", fromHex(keyHex), "AES-CBC", false, ["encrypt"]);
    const enc = await crypto.subtle.encrypt({name:"AES-CBC", iv}, key, new TextEncoder().encode(msg));
    document.getElementById('outEnc').value = toHex(iv) + toHex(enc);
};

document.getElementById('doDec').onclick = async () => {
    const keyHex = document.getElementById('inKeyDec').value;
    const full = document.getElementById('msgDec').value;
    const iv = fromHex(full.slice(0,32));
    const data = fromHex(full.slice(32));
    const key = await crypto.subtle.importKey("raw", fromHex(keyHex), "AES-CBC", false, ["decrypt"]);
    const dec = await crypto.subtle.decrypt({name:"AES-CBC", iv}, key, data);
    document.getElementById('outDec').value = new TextDecoder().decode(dec);
};
</script>
</body>
</html>
